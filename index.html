<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camviro — Document scanner and PDF tools</title>
<meta name="description" content="Camviro is a document scanner and PDF app. Privacy Policy, Terms and support.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#FAF8F5; --fg:#1A1A1C; --muted:#5f5f64; --line:#E3DFD8; --accent:#0E6B68; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131415; --fg:#F2F1EE; --muted:#A3A3A8; --line:#303134; --accent:#5DBFB8; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:72px 20px; text-align:center; }
  img { width:88px; height:88px; border-radius:22px; background:#fff; border:1px solid var(--line); }
  h1 { font-size:2rem; letter-spacing:-0.03em; margin:20px 0 8px; }
  p { color:var(--muted); margin:0 0 12px; }
  ul { list-style:none; padding:0; margin:32px 0 0; border:1px solid var(--line); border-radius:14px; text-align:left; }
  li + li { border-top:1px solid var(--line); }
  a { color:var(--accent); }
  li a { display:block; padding:16px 20px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Camviro logo" width="88" height="88">
  <h1>Camviro</h1>
  <p>Scan. Save. Simplify.</p>
  <p>A document scanner and PDF app for your phone. Coming soon to Google Play.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms and Conditions</a></li>
    <li><a href="mailto:contactcamviro@gmail.com">Support: contactcamviro@gmail.com</a></li>
  </ul>
</main>
</body>
</html>
